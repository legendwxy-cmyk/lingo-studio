services:
  - type: web
    name: lingoreel-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "500"
